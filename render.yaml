# JobScout SaaS — Render Blueprint
# Deploy: https://render.com/deploy?repo=...

# Shared secrets — uses "JobScout" env group on Render with:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DEEPSEEK_API_KEY

services:
  # FastAPI Backend
  - type: web
    name: jobscout-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    envVars:
      - fromGroup: JobScout
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://jobscout-app.onrender.com,http://localhost:3000
      - key: ENVIRONMENT
        value: production

  # Worker (scrape + score loop)
  - type: worker
    name: jobscout-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: .
    region: frankfurt
    plan: starter
    envVars:
      - fromGroup: JobScout
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: FRANCE_TRAVAIL_CLIENT_ID
        sync: false
      - key: FRANCE_TRAVAIL_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CYCLE_INTERVAL_HOURS
        value: "4"

  # Next.js Frontend
  - type: web
    name: jobscout-app
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: frankfurt
    plan: free
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        value: https://jobscout-api.onrender.com
