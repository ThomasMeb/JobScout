services:
  backend:
    build: { context: ./backend }
    env_file: .env.prod
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jobscout
      - caddy_net

  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    env_file: .env.prod
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [jobscout]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: "https://jscpstwuskjgpwqlltym.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_Gudx59QgqIUZP3VGzHEHTg_HIgCgw1G"
        NEXT_PUBLIC_API_URL: ""
    expose: ["3000"]
    restart: unless-stopped
    depends_on: [backend]
    networks:
      - jobscout
      - caddy_net

volumes:
  caddy_data:
  caddy_config:

networks:
  jobscout:
    driver: bridge
  caddy_net:
    external: true
