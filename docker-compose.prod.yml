services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }
    networks: [jobscout]

  backend:
    build: { context: ./backend }
    env_file: .env.prod
    expose: ["8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks: [jobscout]

  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    env_file: .env.prod
    restart: on-failure:5
    depends_on:
      backend: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks: [jobscout]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: "https://jscpstwuskjgpwqlltym.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_Gudx59QgqIUZP3VGzHEHTg_HIgCgw1G"
        NEXT_PUBLIC_API_URL: ""
    expose: ["3000"]
    restart: unless-stopped
    depends_on: [backend]
    networks: [jobscout]

volumes:
  caddy_data:
  caddy_config:

networks:
  jobscout:
    driver: bridge
