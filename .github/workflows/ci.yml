name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          # Worker deps (skip python-jobspy: heavy/optional, scraper disabled)
          grep -v '^python-jobspy' worker/requirements.txt > /tmp/worker-req.txt
          pip install -r /tmp/worker-req.txt
          # Backend deps
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest -q -m "not integration"

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
        env:
          # Build-time env: keep public, all deferred to runtime in production.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key
          NEXT_PUBLIC_API_URL: http://localhost:8000
